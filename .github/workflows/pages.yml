# GitHub Pages deploy via Actions — REPLACES the built-in "pages build and
# deployment" (classic branch deploy). WHY: the classic builder runs with no
# concurrency guard, so the price bot's ~8-min deploy-key pushes occasionally
# raced each other and one lost with "Deployment failed, try again later."
# Harmless to the site (the next push always redeployed) but it spammed FAILURE
# emails. A workflow-based deploy lets us serialise deploys with a concurrency
# group, so overlapping deploys QUEUE instead of colliding -> no more failures.
#
# The site still redeploys on EVERY push to main (data pushes included), so the
# ~10-min price snapshots stay fresh — same freshness as before, just no races.
#
# One-time switch that enables this: Pages build_type = "workflow" (done via the
# API / Settings -> Pages -> Source: GitHub Actions). To revert to the classic
# builder, set Source back to "Deploy from a branch" (main / root).
name: pages-deploy
on:
  push:
    branches: [main]        # every push (incl. the price-bot SSH deploy-key
                            # pushes, which DO fire push events) redeploys
    paths-ignore:
      - data/price_state.json   # cooldown-state-only commits don't change the site
  workflow_dispatch:        # manual redeploy / first deploy after the switch
permissions:
  contents: read
  pages: write
  id-token: write
# Serialise deploys: at most one running + one pending; a newer push supersedes
# the pending one. cancel-in-progress:false so an in-flight publish is never cut
# mid-way (GitHub's recommended setting for Pages). Separate group from the
# price chain's `prices`, so the two never block each other.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # Static URL: the deploy step is continue-on-error (see below) so page_url
      # isn't guaranteed to be set; the site URL is fixed anyway.
      url: https://tkh54.github.io/tbh-appraiser/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # Serve the repo root (identical to the old branch "/" deploy) but stage
      # into _site MINUS .git, so the artifact isn't bloated by the large,
      # frequently-churned binary history (prices/history/learned_seed).
      - name: Stage site (repo root, excluding VCS)
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='_site' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # ONE attempt, 5-min cap. Retrying in-run is provably useless: a Pages
      # deployment's ID *is* the commit SHA, and on timeout deploy-pages cancels
      # its own deployment — so re-creating the same SHA returns an instant
      # "Deployment cancelled." (2026-08-06: three retries, three instant
      # cancels). Recovery comes from the NEXT push instead, which carries a new
      # SHA; the price bot pushes every ~10 min, so that is the natural retry.
      # The 5-min cap (was 10) matters: a 10-min stall outlasted the push
      # interval, so runs piled up in the concurrency queue and the jam became
      # self-sustaining.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 300000

      # A stalled Pages backend WEDGES the whole pipeline: deploy-pages cancels
      # its deployment on timeout, but the backend can still hold it "in
      # progress", so every later run dies with
      #   HTTP 400 ... due to in progress deployment. Please cancel <SHA> first
      # and the site freezes on the last good build until a human clears it by
      # hand via the API (2026-08-06 incident — the site sat 55+ min stale).
      # So on failure, clear our own deployment plus those of recent older
      # commits, which is what unblocks the next push. Only runs when the deploy
      # actually failed, so a healthy deploy never touches a live deployment;
      # cancelling an already-finished deployment just errors and is ignored.
      - name: Clear wedged Pages deployments
        if: steps.deploy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          for sha in $(gh api "repos/$REPO/commits?sha=main&per_page=6" --jq '.[].sha'); do
            if gh api -X POST "repos/$REPO/pages/deployments/$sha/cancel" >/dev/null 2>&1; then
              echo "cleared wedged deployment $sha"
            fi
          done

      # Alert on the thing that actually matters — the site being STALE — not on
      # a red deploy step. A single failed deploy is harmless because the next
      # push redeploys ~10 min later, and the old alert cried "反映が停止した可能性"
      # every time, which trained us to ignore it. Only ring (and only then let
      # the run go red) once the LIVE site is genuinely behind, using the same
      # 45-min gate the price chain uses.
      - name: Check live freshness / alert only if the site is really stale
        if: steps.deploy.outcome == 'failure'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          LIVE_T=$(curl -fsSL --max-time 30 "https://tkh54.github.io/tbh-appraiser/data/prices.json" | jq -r '.t' || echo "")
          if [ -z "$LIVE_T" ] || [ "$LIVE_T" = "null" ]; then
            AGE=999   # can't read the site at all -> treat as broken
          else
            AGE=$(( ( $(date -u +%s) - $(date -u -d "$LIVE_T" +%s) ) / 60 ))
          fi
          echo "live data age: ${AGE} min"
          if [ "$AGE" -lt 45 ]; then
            echo "::warning::Pages deploy failed but the live site is only ${AGE} min old; the next push should redeploy it."
            exit 0
          fi
          if [ -n "$DISCORD_WEBHOOK" ]; then
            jq -n --arg c "❌ **サイトのデータが${AGE}分前で止まっています**（Pagesデプロイが継続失敗）→ $RUN_URL" \
              '{content:$c}' | curl -s -H "Content-Type: application/json" --data-binary @- "$DISCORD_WEBHOOK"
          fi
          exit 1
